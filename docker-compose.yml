
services:

  ollama:
    image: ollama/ollama:latest
    container_name: playwright-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  playwright-tests:
    image: playwright-ai-automation:1.0
    container_name: playwright-tests
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      ollama:
        condition: service_healthy
    command: ["npx", "playwright", "test", "tests/api/ai-analyzer.spec.ts", "--workers=1", "--reporter=list"]

volumes:
  ollama_data:
